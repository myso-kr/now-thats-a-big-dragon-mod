name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Launcher (Rust)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  web:
    name: Injected scripts (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }

      # Code under web/ runs inside the game's renderer. A syntax error there leaves
      # nothing at all in the launcher log; it just dies quietly. This is the only net.
      - name: node --check (everything)
        run: |
          set -e
          find . -name '*.js' -not -path './node_modules/*' -not -path './target/*' \
            -print0 | xargs -0 -n1 -t node --check

      # Unit tests. They run without the game. This is `npm test`, not a subset of it:
      # the two globs that used to be listed here left lib/ and tools/ out, so the
      # guards on the published font hashes and on the documents' own claims - the two
      # things nothing else watches - were never running in CI at all.
      - name: Unit tests
        run: npm test 2>&1 | tee test.log

      # The one number the documents publish that cannot be counted from the source: a
      # loop can produce any number of tests at runtime. tools/docs.test.js checks every
      # other claim; this checks that one against the runner's own summary.
      - name: The test count the README publishes is the one that ran
        run: |
          set -e
          ran=$(grep -oP '(?<= tests )\d+$' test.log | head -1)
          said=$(grep -oP 'tests-\K\d+(?=%20JS)' README.md)
          test "$ran" = "$said" || {
            echo "::error file=README.md::badge says $said JS tests; $ran ran"; exit 1; }
          echo "$ran JS tests, and the badge agrees"

      - name: JSON parses
        run: |
          set -e
          for f in $(git ls-files '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error file=$f::failed to parse"; exit 1; }
          done

  locale:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # Only for the Node-versus-Rust comparison at the end of this job.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with: { key: locale }

      # Everything under locale/ is generated from the tables under translations/. A
      # string edited in the exported worksheet and never carried back into its table
      # would be silently undone by the next build. This runs the real importer,
      # compares against what ships byte for byte, and puts the file back.
      - name: Source reproduces what ships
        run: python tools/build-translation.py --all --check

      # This one compares each translated .ink against the game's own English original,
      # and the originals are inside the game. A runner has no game, so it skips - every
      # time, which is the problem with saying it as a warning: a warning that fires on
      # every run is one nobody reads, and it was drowning the ones that mean something.
      # It is a notice now, and the drift check that CAN run without the game runs above.
      - name: Dialogue structure (needs the game; skipped here)
        run: node tools/check-dialogs.js || echo "::notice::dialogue structure not checked - no game installation on the runner"

      # The site's twenty-two pages are generated from the same catalogue the launcher
      # matches on, so a language cannot appear on the site without shipping - and a
      # page cannot lose the four warnings that can cost somebody something.
      - name: The site still matches the catalogue
        run: python tools/build-site.py --check

      - name: Fonts and their licences are bundled
        run: |
          set -e
          ls locale/fonts/OFL-*.txt >/dev/null || { echo "::error::no OFL licence files"; exit 1; }
          node -e "
            const fs=require('fs'), path=require('path'), cfg=require('./config');
            let n=0;
            for (const lang of Object.keys(require('./locale/languages.json').languages)) {
              for (const f of cfg.language(lang).fonts) {
                const p = path.join(cfg.PATHS.FONTS, f.file);
                if (!fs.existsSync(p)) {
                  console.error('::error::' + lang + ' references a font that is not here: ' + p);
                  process.exit(1);
                }
                n += 1;
              }
            }
            console.log(n + ' font references check out');
          "

      # Whether the characters a translation uses are actually in that language's font.
      # Galmuri's Han characters are the traditional forms used for Korean hanja only,
      # so 269 simplified characters once shipped as blank boxes with nothing logged.
      - name: Font character coverage
        run: node tools/check-fonts.js

      # Autoplay picks a dialogue option by where it sits in the .ink file and finds it
      # on screen by its label, and both launchers build that table themselves. If they
      # ever disagreed, autoplay would choose the wrong option in silence.
      - name: Dialogue option labels agree between Node and Rust
        run: |
          set -e
          node tools/dialog-choices.js > choices.json
          BD_NODE_CHOICES=choices.json cargo test --test bundle the_rust_dialogue_choices

      # A .ink file with CRLF or a BOM unsettles the game's Ink compilation.
      - name: Encoding and line endings
        run: |
          set -e
          fail=0
          for f in $(git ls-files 'locale/**/*.ink'); do
            if head -c3 "$f" | grep -q $'\xef\xbb\xbf'; then
              echo "::error file=$f::has a BOM"; fail=1
            fi
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::has CRLF line endings"; fail=1
            fi
          done
          exit $fail

  # Checks that need the game installed cannot run in CI. A green tick here means
  # "the code does not contradict itself", not "this works on game 1.0.6".
