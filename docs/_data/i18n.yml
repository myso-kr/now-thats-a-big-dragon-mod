  two: "Un panou de trișare pentru resurse, îmbunătățiri și viteza jocului."
  three: "Un automat care cumpără, luptă, răspunde în dialoguri și străbate singur temnițele."
  skip: "Sari la conținut"
  download: "Descarcă"
  source: "Cod sursă"
  notice_h: "Citește înainte de a-l folosi"
  unofficial: "Mod neoficial făcut de fani. Fără legătură cu dezvoltatorul sau editorul jocului ori cu Valve și fără aprobarea sau sponsorizarea lor. Mărcile și drepturile aparțin titularilor lor."
  copy: "Necesită un exemplar al jocului cumpărat legal. Acest depozit nu conține text sau resurse originale - fără exemplarul tău, traducerea nu poate fi aplicată."
  files: "Niciun fișier al jocului nu este modificat. Lansatorul rescrie răspunsurile doar în memorie. Închide-l și peticul dispare."
