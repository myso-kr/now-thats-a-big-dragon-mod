  design: "Cum e proiectată pagina asta"
  save: "Salvarea se poate strica. Trișările și jocul automat duc jocul în stări la care nu se așteaptă. Fă o copie înainte de prima rulare."
  achievements: "Panoul de trișare blochează implicit trimiterea realizărilor și a statisticilor către Steam. Dezactivează asta și trișează, iar realizările necâștigate rămân permanent în cont."
  port: "Se deschide un port de depanare la distanță. Jocul pornește cu --remote-debugging-port=9223, fără autentificare: orice program de pe același calculator se poate conecta și îl poate controla. Activează-l doar cât folosești modul."
  warranty: "Oferit ca atare, fără garanție. Depozitul va fi retras la cererea titularului de drepturi: help@myso.kr"
