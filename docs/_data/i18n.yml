# The layout looks these up by the page's language and falls back to English,
# so a page is localised rather than an English page with a translated headline.

"en":
  title: "Now THAT'S a Big Dragon! — language patch, cheats, autoplay"
  description: "Unofficial mod for the Steam idle game Now THAT'S a Big Dragon! - 22 language translations, an in-game cheat widget, and fully autonomous autoplay. Injected over the Chrome DevTools Protocol; no game files are modified."
  one: "Read the game in your own language."
  two: "A cheat widget for resources, upgrades and game speed."
  three: "An autoplay that buys, fights, answers dialogue and crawls dungeons unattended."
  skip: "Skip to content"
  download: "Download"
  source: "Source"
  notice_h: "Before you use it"
  unofficial: "Unofficial fan-made mod. Not affiliated with, endorsed by, or sponsored by the developer or publisher of the game, or by Valve. All trademarks and copyrights belong to their respective owners."
  copy: "Requires a legitimately purchased copy of the game. This repository contains no original game text or assets. The translation cannot be applied without your own copy."
  files: "No game files are modified. The launcher rewrites responses in memory only. Close it and the patch is gone."
  langs_h: "Every language"
  langs_note: "A page appears here exactly when its translation ships, because both come from the same catalogue."
  drawn: "drawn here"
  system: "system font"
  design: "How this page is designed"
  save: "Your save can break. Cheats and autoplay can put the game into states it does not expect. Back it up before the first run."
  achievements: "The cheat widget blocks Steam achievement and stat submission by default. Turn that off and use cheats, and unearned achievements are recorded on your account permanently."
  port: "A remote debugging port is opened. The game is launched with --remote-debugging-port=9223, which has no authentication: any program on the same machine can attach and control it. Enable it only while using the mod."
  warranty: "Provided as is, with no warranty. This repository will be taken down on request from the rights holder: help@myso.kr"
  faq_h: "Questions people ask"
  q_files: "Does this mod modify the game's files?"
  q_achievements: "Will this affect my Steam achievements?"
  q_copy: "Do I need to own the game?"
  q_langs: "Which languages are supported?"
  q_save: "Can it break my save?"
  how_h: "Installing it"
  how_1: "Download the latest release from GitHub and unzip it anywhere."
  how_2: "Close the game, then run bigdragon.exe. It starts the game itself; there is nothing else to install."
  how_3: "Pick your language in the game's own settings. F8 opens the cheat widget, F9 the autoplay."
