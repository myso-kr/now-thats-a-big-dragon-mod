"el":
  title: "Now THAT'S a Big Dragon! — μετάφραση, κόλπα, αυτόματο παιχνίδι"
  description: "Ανεπίσημο mod για το idle παιχνίδι του Steam Now THAT'S a Big Dragon! - μετάφραση σε 22 γλώσσες, πίνακας κόλπων μέσα στο παιχνίδι και πλήρως αυτόνομο αυτόματο παιχνίδι. Εισάγεται μέσω CDP· κανένα αρχείο του παιχνιδιού δεν αλλάζει."
  one: "Διάβασε το παιχνίδι στη γλώσσα σου."
  two: "Ένας πίνακας κόλπων για πόρους, αναβαθμίσεις και ταχύτητα παιχνιδιού."
  three: "Ένα αυτόματο που αγοράζει, πολεμά, απαντά σε διαλόγους και εξερευνά μπουντρούμια μόνο του."
  skip: "Μετάβαση στο περιεχόμενο"
  download: "Λήψη"
  source: "Πηγαίος κώδικας"
  notice_h: "Διάβασέ το πριν το χρησιμοποιήσεις"
  unofficial: "Ανεπίσημο mod φτιαγμένο από θαυμαστές. Δεν σχετίζεται με τον δημιουργό ή τον εκδότη του παιχνιδιού ούτε με τη Valve, και δεν έχει την έγκριση ή τη χορηγία τους. Τα σήματα και τα δικαιώματα ανήκουν στους κατόχους τους."
  copy: "Χρειάζεται νόμιμα αγορασμένο αντίτυπο του παιχνιδιού. Αυτό το αποθετήριο δεν περιέχει πρωτότυπο κείμενο ή υλικό - χωρίς το δικό σου αντίτυπο η μετάφραση δεν εφαρμόζεται."
  files: "Κανένα αρχείο του παιχνιδιού δεν αλλάζει. Ο εκκινητής ξαναγράφει τις απαντήσεις μόνο στη μνήμη. Κλείσ' τον και η επιδιόρθωση χάνεται."
  langs_h: "Όλες οι γλώσσες"
  langs_note: "Μια σελίδα εμφανίζεται εδώ ακριβώς όταν βγαίνει η μετάφρασή της, γιατί και τα δύο βγαίνουν από τον ίδιο κατάλογο."
  drawn: "σχεδιασμένα εδώ"
  system: "γραμματοσειρά συστήματος"
  design: "Πώς σχεδιάστηκε αυτή η σελίδα"
  save: "Η αποθήκευση μπορεί να χαλάσει. Τα κόλπα και το αυτόματο παιχνίδι φέρνουν το παιχνίδι σε καταστάσεις που δεν περιμένει. Κράτα αντίγραφο πριν την πρώτη εκτέλεση."
  achievements: "Ο πίνακας κόλπων μπλοκάρει εξ ορισμού την αποστολή επιτευγμάτων και στατιστικών στο Steam. Αν το κλείσεις και χρησιμοποιήσεις κόλπα, επιτεύγματα που δεν κέρδισες μένουν μόνιμα στον λογαριασμό σου."
  port: "Ανοίγει θύρα απομακρυσμένης αποσφαλμάτωσης. Το παιχνίδι ξεκινά με --remote-debugging-port=9223, χωρίς έλεγχο ταυτότητας: οποιοδήποτε πρόγραμμα στο ίδιο μηχάνημα μπορεί να συνδεθεί και να το ελέγξει. Ενεργοποίησέ το μόνο όσο χρησιμοποιείς το mod."
  warranty: "Παρέχεται ως έχει, χωρίς εγγύηση. Το αποθετήριο θα αποσυρθεί κατόπιν αιτήματος του δικαιούχου: help@myso.kr"
  faq_h: "Συχνές ερωτήσεις"
  q_files: "Αλλάζει αυτό το mod τα αρχεία του παιχνιδιού;"
  q_achievements: "Θα επηρεάσει τα επιτεύγματά μου στο Steam;"
  q_copy: "Χρειάζεται να έχω το παιχνίδι;"
  q_langs: "Ποιες γλώσσες υποστηρίζονται;"
  q_save: "Μπορεί να χαλάσει την αποθήκευσή μου;"
  how_h: "Εγκατάσταση"
  how_1: "Κατέβασε την τελευταία έκδοση από το GitHub και αποσυμπίεσέ την όπου θέλεις."
  how_2: "Κλείσε το παιχνίδι και τρέξε το bigdragon.exe. Ο εκκινητής ανοίγει μόνος του το παιχνίδι· δεν χρειάζεται τίποτε άλλο."
  how_3: "Διάλεξε γλώσσα από τις ρυθμίσεις του ίδιου του παιχνιδιού. F8 για τον πίνακα κόλπων, F9 για το αυτόματο παιχνίδι."
