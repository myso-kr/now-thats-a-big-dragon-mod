  notice_h: "Les dette først"
  unofficial: "Uoffisiell mod laget av fans. Ingen tilknytning til spillets utvikler eller utgiver eller til Valve, og verken godkjent eller sponset av dem. Varemerker og rettigheter tilhører sine eiere."
  copy: "Krever et lovlig kjøpt eksemplar av spillet. Dette lageret inneholder ingen originaltekst eller ressurser - uten ditt eget eksemplar kan ikke oversettelsen brukes."
