  achievements: "Juksepanelet blokkerer som standard innsending av prestasjoner og statistikk til Steam. Slår du det av og jukser, ligger ufortjente prestasjoner permanent på kontoen."
  port: "En port for fjernfeilsøking åpnes. Spillet startes med --remote-debugging-port=9223 uten autentisering: ethvert program på samme maskin kan koble seg til og styre det. Slå det på bare mens du bruker moden."
