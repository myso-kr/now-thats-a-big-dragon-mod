  achievements: "치트 위젯은 스팀 업적·통계 전송을 기본으로 차단합니다. 이를 끄고 치트를 쓰면 얻지 않은 업적이 계정에 영구히 기록됩니다."
  port: "원격 디버깅 포트가 열립니다. 게임은 --remote-debugging-port=9223 으로 실행되며 인증이 없습니다. 같은 컴퓨터의 어떤 프로그램이든 붙어서 조작할 수 있으니, 모드를 쓰는 동안에만 켜세요."
